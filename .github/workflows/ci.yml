name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - name: Server unit tests
        run: npm test

      # Non-blocking for now: the existing dependency tree already has a
      # backlog of high/critical advisories (mostly transitive, behind a
      # breaking matrix-appservice-bridge major-version bump). Report new
      # findings without redenning every PR until that backlog is cleared.
      - name: Dependency vulnerability audit (report only)
        run: npm audit --audit-level=high || echo "::warning::npm audit found high/critical advisories — see job log"

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client (includes ESLint in CI mode)
        working-directory: client
        env:
          CI: true
          DISABLE_ESLINT_PLUGIN: false
        run: npm run build

      - name: Dependency vulnerability audit (report only)
        working-directory: client
        run: npm audit --audit-level=high || echo "::warning::npm audit found high/critical advisories — see job log"

  # PR/push: unit tests only. Full subscriber HTTP suite: see subscriber-api.yml
