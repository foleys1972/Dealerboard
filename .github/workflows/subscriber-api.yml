name: Subscriber API (integration)

on:
  workflow_dispatch:
  schedule:
    # Nightly optional smoke — disable by removing if too flaky
    - cron: '0 6 * * 1'

jobs:
  subscriber-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intercom_app
          POSTGRES_PASSWORD: intercom
          POSTGRES_DB: trading_intercom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intercom_app -d trading_intercom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: ci-subscriber-api-jwt-secret-32chars-min
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: trading_intercom
      POSTGRES_USER: intercom_app
      POSTGRES_PASSWORD: intercom
      POSTGRES_SSL: 'false'
      TEST_BASE_URL: http://127.0.0.1:5000
      FEDERATION_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - name: Initialize database schema
        run: node -e "require('./server/services/databaseService').initializeDatabase().then(() => process.exit(0)).catch(e => { console.error(e); process.exit(1); })"

      - name: Start server
        run: |
          node server/index.js > server-ci.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:5000/api/status" > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          tail -n 200 server-ci.log || true
          exit 1

      - name: Subscriber API integration tests
        run: npm run test:subscriber-api

      - name: Server log on failure
        if: failure()
        run: tail -n 300 server-ci.log || true
