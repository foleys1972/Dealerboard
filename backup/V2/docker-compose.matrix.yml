version: '3.8'

services:
  # Matrix Synapse Homeserver
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: trading-intercom-synapse
    ports:
      - "8008:8008"
      - "8448:8448"
    volumes:
      - ./server/config/matrix-config.yaml:/data/homeserver.yaml:ro
      - ./server/config/trading-intercom-appservice.yaml:/data/trading-intercom-appservice.yaml:ro
      - synapse_data:/data
      - synapse_logs:/logs
    environment:
      - SYNAPSE_SERVER_NAME=trading-intercom.local
      - SYNAPSE_REPORT_STATS=no
    restart: unless-stopped
    networks:
      - trading-intercom-network

  # PostgreSQL Database for Synapse
  postgres:
    image: postgres:13
    container_name: trading-intercom-postgres
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: trading-intercom-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - trading-intercom-network

  # Redis for Synapse
  redis:
    image: redis:6-alpine
    container_name: trading-intercom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - trading-intercom-network

  # Matrix App Service Bridge
  matrix-appservice:
    build:
      context: .
      dockerfile: Dockerfile.matrix-appservice
    container_name: trading-intercom-matrix-appservice
    ports:
      - "9000:9000"
    environment:
      - MATRIX_HOMESERVER_URL=http://synapse:8008
      - MATRIX_APPSERVICE_URL=http://matrix-appservice:9000
      - MATRIX_APPSERVICE_TOKEN=trading-intercom-token
      - MATRIX_HOMESERVER_TOKEN=trading-intercom-homeserver-token
      - MATRIX_APPSERVICE_ID=trading-intercom
    depends_on:
      - synapse
    restart: unless-stopped
    networks:
      - trading-intercom-network

volumes:
  synapse_data:
  synapse_logs:
  postgres_data:
  redis_data:

networks:
  trading-intercom-network:
    driver: bridge
