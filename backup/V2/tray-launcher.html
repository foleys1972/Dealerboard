<!DOCTYPE html>
<html>
<head>
    <title>TradePulse - Always Ready</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
        }
        
        .tray-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
        }
        
        .tray-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }
        
        .tray-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .tray-icon.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .tray-icon svg {
            width: 30px;
            height: 30px;
            fill: white;
        }
        
        .popup-window {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        
        .popup-window.visible {
            display: flex;
        }
        
        .popup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .popup-header h3 {
            margin: 0;
            font-size: 16px;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .popup-content {
            flex: 1;
            position: relative;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .status-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 12px;
            height: 12px;
            background: #4ade80;
            border-radius: 50%;
            border: 2px solid rgba(0, 0, 0, 0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .minimize-notice {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #667eea;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        .minimize-notice.visible {
            display: block;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="tray-container">
        <div class="tray-icon" id="trayIcon" title="TradePulse - Click to open">
            <div class="status-indicator"></div>
            <svg viewBox="0 0 24 24">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm0 4h8v2H6zm10-4h2v6h-2z"/>
            </svg>
        </div>
    </div>

    <div class="popup-window" id="popupWindow">
        <div class="popup-header">
            <h3>🎙️ TradePulse Intercom</h3>
            <button class="close-btn" id="closeBtn">&times;</button>
        </div>
        <div class="popup-content">
            <iframe id="appFrame" src="http://localhost:5000"></iframe>
        </div>
    </div>

    <div class="minimize-notice" id="minimizeNotice">
        ✓ TradePulse minimized to tray
    </div>

    <script>
        const trayIcon = document.getElementById('trayIcon');
        const popupWindow = document.getElementById('popupWindow');
        const closeBtn = document.getElementById('closeBtn');
        const minimizeNotice = document.getElementById('minimizeNotice');
        const appFrame = document.getElementById('appFrame');

        let isOpen = false;

        // Toggle popup
        trayIcon.addEventListener('click', () => {
            isOpen = !isOpen;
            popupWindow.classList.toggle('visible', isOpen);
            trayIcon.classList.toggle('active', isOpen);
            
            if (isOpen) {
                // Reload iframe to ensure fresh state
                appFrame.src = appFrame.src;
            }
        });

        // Close button
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isOpen = false;
            popupWindow.classList.remove('visible');
            trayIcon.classList.remove('active');
            
            // Show minimize notice
            minimizeNotice.classList.add('visible');
            setTimeout(() => {
                minimizeNotice.classList.remove('visible');
            }, 3000);
        });

        // Prevent closing when clicking inside popup
        popupWindow.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Close when clicking outside
        document.addEventListener('click', (e) => {
            if (isOpen && !trayIcon.contains(e.target) && !popupWindow.contains(e.target)) {
                isOpen = false;
                popupWindow.classList.remove('visible');
                trayIcon.classList.remove('active');
            }
        });

        // Keep app alive - prevent sleep
        const keepAlive = () => {
            // Send ping to keep connection alive
            console.log('Keep-alive ping');
        };
        
        setInterval(keepAlive, 30000); // Every 30 seconds

        // Notification on load
        window.addEventListener('load', () => {
            console.log('TradePulse Tray Launcher Ready');
            
            // Optional: Auto-open on first load
            // setTimeout(() => trayIcon.click(), 1000);
        });

        // Prevent unload if active call (future enhancement)
        window.addEventListener('beforeunload', (e) => {
            // Check if there's an active call
            // For now, always allow close
            // e.preventDefault();
            // return e.returnValue = 'Are you sure you want to exit?';
        });
    </script>
</body>
</html>
