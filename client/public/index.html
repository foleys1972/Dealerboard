    <!-- MetaMask Prevention -->
    <script>
      // Simple MetaMask blocking without recursion
      (function() {
        console.log('🚫 Starting MetaMask prevention...');
        
        // Block MetaMask objects
        const blockMetaMask = () => {
          if (window.ethereum) {
            console.log('🚫 Removing window.ethereum');
            delete window.ethereum;
          }
          if (window.web3) {
            console.log('🚫 Removing window.web3');
            delete window.web3;
          }
          if (window.MetaMask) {
            console.log('🚫 Removing window.MetaMask');
            delete window.MetaMask;
          }
        };
        
        // Run immediately and periodically
        blockMetaMask();
        setInterval(blockMetaMask, 1000); // Reduced frequency to prevent performance issues
        
        console.log('🚫 MetaMask prevention activated');
      })();
    </script>
