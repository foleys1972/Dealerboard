# Matrix App Service Configuration for TradeCom
# This configuration allows TradeCom to integrate with Matrix as an app service

# App Service ID and URL
id: "trading-intercom"
url: "http://localhost:9000"
as_token: "trading-intercom-token"
hs_token: "trading-intercom-homeserver-token"

# Namespaces for users and rooms
namespaces:
  users:
    - regex: "@trading-intercom_.*"
      exclusive: true
  rooms:
    - regex: "#trading-group-.*"
      exclusive: true
    - regex: "#trading-broadcast-.*"
      exclusive: true
    - regex: "#trading-private-.*"
      exclusive: true

# Rate limiting
rate_limited: false

# Protocols
protocols: []

# Sender localpart
sender_localpart: "trading-intercom-bot"

# Delegate
delegate: false
